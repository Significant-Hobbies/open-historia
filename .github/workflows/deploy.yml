name: Deploy to Cloudflare Workers
on:
  workflow_dispatch:
jobs:
  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm cf:build
      - name: Validate GitHub deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      # `wrangler deploy` also re-syncs triggers, which lists the aliveville.com
      # zone's Worker routes and needs zone-level "Workers Routes: Read". The
      # Fleet deploy token is account-scoped only, so CI uploads a version and
      # promotes it instead. The historia.aliveville.com custom domain is already
      # attached to the Worker; if wrangler.toml routes change, run
      # `pnpm deploy` locally (wrangler OAuth) or give the token zone access.
      - name: Upload and promote Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID" | tee upload.log
          version_id=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' upload.log | awk '{print $4}')
          test -n "$version_id" || { echo "::error::Could not read Worker Version ID from wrangler output"; exit 1; }
          pnpm exec wrangler versions deploy "$version_id@100%" --message "GitHub Actions $GITHUB_RUN_ID" --yes
      - name: Smoke check production worker
        run: curl --fail --silent --show-error --location --max-time 30 https://historia.aliveville.com >/dev/null
